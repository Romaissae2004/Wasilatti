# ===================================================================
# CONFIGURATION GENERALE
# ===================================================================
spring.application.name=Wasilatti
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=8081

# ===================================================================
# BASE DE DONNEES & JPA (HEAD)
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/wassilati
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# SECURITE - JWT (feature/auth)
# ===================================================================
# Valeurs lues depuis les variables d'environnement
jwt.secret=${JWT_SECRET}
jwt.expire.access=${JWT_EXPIRE_ACCESS:900000}
jwt.expire.refresh=${JWT_EXPIRE_REFRESH:604800000}

# ===================================================================
# SECURITE - OAuth2 Google (feature/auth)
# ===================================================================
# Identifiants a recuperer depuis la Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===================================================================
# SERVICE D'EMAIL - SMTP (feature/auth)
# ===================================================================
# Utilise pour : reset password, confirmation email, notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# STOCKAGE D'IMAGES - Cloudinary & Upload (HEAD)
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# ===================================================================
# DISTRIBUTION AUTOMATIQUE - Point de retrait (entrepôt / marchand)
# ===================================================================
wasilatti.default-pickup-latitude=34.0209
wasilatti.default-pickup-longitude=-6.8416

app.frontend.oauth2-redirect-url=http://localhost:4200/oauth2/redirect

